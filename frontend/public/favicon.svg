<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1e1346"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Orange Wallet / Card -->
  <g filter="url(#glow)">
    <rect x="86" y="116" width="340" height="280" rx="42" fill="url(#cardGrad)"/>
  </g>

  <!-- Wallet Flap & Accent -->
  <path d="M 86 210 L 426 210" stroke="rgba(0,0,0,0.25)" stroke-width="5"/>
  <path d="M 120 145 L 392 145" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round"/>

  <!-- Center Gold Coin -->
  <circle cx="256" cy="275" r="75" fill="url(#goldGrad)" stroke="#b45309" stroke-width="4"/>
  <circle cx="256" cy="275" r="62" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Rising Bar Chart inside Coin -->
  <!-- Bar 1 -->
  <rect x="216" y="270" width="16" height="32" rx="4" fill="#0f172a"/>
  <!-- Bar 2 -->
  <rect x="244" y="250" width="16" height="52" rx="4" fill="#0f172a"/>
  <!-- Bar 3 (Emerald Green) -->
  <rect x="272" y="230" width="16" height="72" rx="4" fill="#10b981"/>

  <!-- Trend Arrow -->
  <path d="M 220 255 Q 256 235 292 216" fill="none" stroke="#10b981" stroke-width="4.5" stroke-linecap="round"/>
  <polygon points="296,212 284,217 292,226" fill="#10b981"/>
</svg>

