
server.port=${PORT:8080}
server.address=0.0.0.0

spring.application.name=steve-budget

# Use H2 database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:budgetdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# SQL logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# Pretty print JSON responses
spring.jackson.serialization.indent_output=true

# Handle circular references (for @JsonIgnore annotations)
spring.jackson.serialization.fail_on_empty_beans=false


# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# Firebase Admin Configuration
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.project-id=${FIREBASE_PROJECT_ID:daily-5c591}