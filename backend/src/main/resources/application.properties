
server.port=${PORT:8080}
server.address=0.0.0.0

spring.application.name=steve-budget

# Database configuration (Defaults to H2, easily overridden by PostgreSQL / MySQL in deployment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:budgetdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console (Disabled by default in production)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# SQL logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Pretty print JSON responses
spring.jackson.serialization.indent_output=true

# Handle circular references (for @JsonIgnore annotations)
spring.jackson.serialization.fail_on_empty_beans=false

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,https://*.onrender.com,https://*.vercel.app,https://*.web.app,https://*.firebaseapp.com}

# Firebase Admin Configuration
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.project-id=${FIREBASE_PROJECT_ID:daily-5c591}